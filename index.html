<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papelería POS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:#25324a;font:15px system-ui}header{background:#293653;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}h1,h2{margin:0 0 14px}header h1{margin:0;font-size:22px}button,input,select{font:inherit;padding:10px;border:1px solid #ccd3e0;border-radius:8px}button{cursor:pointer;background:#cdefe8;color:#20334c;font-weight:600}button:disabled{opacity:.5}input,select{background:white;min-width:0}form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.panel{background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #26324a0c}.shell{display:flex;min-height:90vh}nav{width:210px;background:#e7e5f5;padding:14px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;border:0}nav button.active{background:white}main{flex:1;min-width:0;padding:20px}.scroll{overflow:auto;max-height:55vh}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:12px;text-align:left;border-bottom:1px solid #e7eaf0}th{position:sticky;top:0;background:#eae9f6}th button{padding:0;border:0;background:transparent}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{font-size:26px;font-weight:700}.muted{color:#65748a}.danger{color:#a32424}.auth{max-width:420px;margin:60px auto;padding:25px}.auth input,.auth button{width:100%}.auth form{display:grid}label{display:grid;gap:4px}dialog{border:0;border-radius:14px;width:min(540px,94vw);padding:22px}dialog form{display:grid;grid-template-columns:1fr 1fr}dialog::backdrop{background:#17223c80}[hidden]{display:none!important}@media(max-width:700px){.shell{display:block}nav{width:auto;display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{padding:12px}.panel{padding:13px}}@media print{body *{visibility:hidden}#ticket,#ticket *{visibility:visible}#ticket{position:absolute;top:0;left:0;width:75mm;color:black;background:white}#ticket button{display:none}}
</style></head><body><header><h1>Papelería POS</h1><span id="status">Acceso privado</span><button id="logout" hidden>Cerrar sesión</button></header>
<section class="auth panel" id="auth"><h2>Iniciar sesión</h2><p class="muted">Cuenta independiente de Papelería POS</p><form id="login"><input name="email" type="email" placeholder="Correo electrónico" required><input name="password" type="password" placeholder="Contraseña" required><button>Entrar</button></form><p id="authmsg" role="alert"></p></section>
<div class="shell" id="workspace" hidden><nav id="nav"></nav><main><h2 id="heading"></h2><div id="page"></div></main></div>
<dialog id="modal"></dialog><div id="ticket" hidden></div>
<script>
'use strict';
const API='https://zifvsfvufvpaiwgrnkxt.supabase.co',KEY='sb_publishable_XoFzgKBBpJpTaLCkCitDeA_51yW3w9g';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(), money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(v/100), cents=v=>Math.round(Number(v)*100), uid=()=>crypto.randomUUID(), clone=v=>structuredClone(v);
let session=null,state={products:[],sales:[],movements:[],customers:[],cash:[]},rev=null,busy=false,tab='Ventas',cart=[],query='',order='name',descending=false,customer='';
const SESSION_KEY='papeleria-pos-online:session:v1';
let refreshPromise=null,refreshTimer=null,closing=false;
function remember(value){session=value;try{localStorage.setItem(SESSION_KEY,JSON.stringify(value))}catch{}scheduleRefresh()}
function forget(){clearTimeout(refreshTimer);session=null;try{localStorage.removeItem(SESSION_KEY)}catch{}}
function scheduleRefresh(){clearTimeout(refreshTimer);if(!session)return;refreshTimer=setTimeout(()=>renew().catch(()=>{}),Math.max(1000,Math.min(2147483647,(session.expires_at*1000-Date.now())-90000)))}
async function renew(){if(closing||!session)throw Error('Sesión cerrada');if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{try{let saved;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}if(saved?.user?.id===session.user?.id&&saved.refresh_token!==session.refresh_token&&saved.expires_at*1000>Date.now()+90000){remember(saved);return saved}let token=session.refresh_token;let res=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:token})});if(!res.ok){if(res.status===400||res.status===401){forget();returnToLogin('Tu sesión expiró. Inicia sesión de nuevo.')}throw Error('No se pudo renovar la sesión')}let next=await res.json();if(closing)throw Error('Sesión cerrada');remember(next);return next}catch(e){if(session&&!closing){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>renew().catch(()=>{}),30000)}throw e}finally{refreshPromise=null}})();return refreshPromise}
function returnToLogin(message=''){state={products:[],sales:[],movements:[],customers:[],cash:[]};cart=[];rev=null;customer='';$('workspace').hidden=true;$('auth').hidden=false;$('logout').hidden=true;$('status').textContent='Acceso privado';$('page').replaceChildren();$('authmsg').textContent=message}
function enterWorkspace(){ $('auth').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;$('status').textContent='Conectado';show('Ventas')}
async function request(path,opts={}){if(session&&!closing&&!path.startsWith('/auth/v1/token')&&session.expires_at*1000<Date.now()+60000)await renew();let r=await fetch(API+path,{...opts,headers:{apikey:KEY,'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.access_token}:{}),...opts.headers}});let t=await r.text(),v;try{v=JSON.parse(t)}catch{v=t}if(!r.ok)throw Error(v?.message||v?.msg||v?.error_description||'Error '+r.status);return v}
let role='employee',operatorName='';
async function pos(action,extra={}){return request('/functions/v1/pos-api',{method:'POST',body:JSON.stringify({action,...extra})})}
function accept(v){role=v.role;operatorName=v.name;state=v.payload;rev=v.revision}
async function load(){accept(await pos('load'))}
async function mutate(action,extra={}){if(busy||!session)return null;busy=true;$('workspace').inert=true;try{let v=await pos(action,{revision:rev,...extra});accept(v);$('status').textContent='Guardado en nube';return v}catch(e){alert('No se confirmó el guardado: '+e.message);return null}finally{busy=false;$('workspace').inert=false}}
async function save(next){return !!(await mutate('save',{payload:next}))}
$('login').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{remember(await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}));await load();e.target.reset();enterWorkspace()}catch(err){forget();$('authmsg').textContent=err.message}finally{b.disabled=false}};
async function signOut(){closing=true;clearTimeout(refreshTimer);try{if(refreshPromise)await refreshPromise.catch(()=>{});if(session)await request('/auth/v1/logout',{method:'POST'})}catch{}finally{forget();returnToLogin();closing=false}}
$('logout').onclick=()=>{if(confirm('¿Cerrar sesión? Las ventas guardadas se conservan.'))signOut()};
window.addEventListener('storage',e=>{if(e.key!==SESSION_KEY)return;if(!e.newValue){forget();returnToLogin('Sesión cerrada en otra pestaña.')}else if(session&&!closing){try{const next=JSON.parse(e.newValue);if(next.user?.id===session.user?.id){session=next;scheduleRefresh()}}catch{}}});
async function restoreSession(){try{let saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(!saved?.refresh_token)return;session=saved;$('authmsg').textContent='Restaurando sesión…';if(saved.expires_at*1000<Date.now()+90000)await renew();else scheduleRefresh();await load();$('authmsg').textContent='';enterWorkspace()}catch(e){$('authmsg').textContent='No se pudo restaurar la sesión: '+e.message;}}
async function closeCash(){if(cart.length)return alert('Cobra o elimina la venta pendiente antes del corte.');if(!confirm('¿Confirmar corte de caja y cerrar sesión?'))return;if(await mutate('close'))await signOut()}
const pages=['Ventas','Productos','Inventario','Historial','Clientes','Corte de caja','Reportes','Configuración','Usuarios'];
function allowedPages(){return role==='admin'?pages:['Ventas','Historial','Corte de caja']}
function show(t){if(!allowedPages().includes(t))return;tab=t;query='';order='name';descending=false;$('heading').textContent=t;$('nav').innerHTML=allowedPages().map(p=>'<button data-tab="'+esc(p)+'" class="'+(p===t?'active':'')+'">'+esc(p)+'</button>').join('');render()}
$('nav').onclick=e=>{let t=e.target.dataset.tab;if(t)show(t)};
function table(cols,rows){return '<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function row(c){return '<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>'}
function filtered(physical=false){return state.products.filter(p=>(!physical||!p.service)&&(norm(p.name).includes(norm(query))||norm(p.code).includes(norm(query)))).sort((a,b)=>(descending?-1:1)*String(a[order]).localeCompare(String(b[order]),'es',{numeric:true,sensitivity:'base'}))}
function toolbar(){return '<div class="toolbar"><input id="search" placeholder="Buscar por nombre o código" value="'+esc(query)+'"><select id="sort"><option value="name:0">Nombre A-Z</option><option value="name:1">Nombre Z-A</option><option value="code:0">Código ascendente</option><option value="code:1">Código descendente</option></select><button id="clearSearch">Limpiar</button></div>'}
function controls(){let s=$('search');if(!s)return;s.oninput=()=>{query=s.value;fillList()};$('sort').value=order+':'+Number(descending);$('sort').onchange=e=>{let [a,b]=e.target.value.split(':');order=a;descending=b==='1';fillList()};$('clearSearch').onclick=()=>{query='';s.value='';fillList();s.focus()}}
function fillList(){let p=filtered(tab==='Inventario');let el=$('list');if(!el)return;let c=tab==='Ventas'?['Código','Nombre','Precio','Existencia','']:tab==='Inventario'?['<button data-sort="code">Código ↕</button>','<button data-sort="name">Nombre ↕</button>','Existencia','Mínimo','Estado','']:['<button data-sort="code">Código ↕</button>','<button data-sort="name">Nombre ↕</button>','Categoría','Costo','Venta','Existencia','Tipo',''];el.innerHTML=table(c,p.map(x=>row(tab==='Ventas'?[esc(x.code),esc(x.name),money(x.price),x.service?'Servicio':x.stock,'<button data-add="'+x.id+'">Agregar</button>']:tab==='Inventario'?[esc(x.code),esc(x.name),x.stock,x.minimum,x.stock<=x.minimum?'<span class="danger">Bajo</span>':'Correcto','<button data-adjust="'+x.id+'">Ajustar</button>']:[esc(x.code),esc(x.name),esc(x.category),money(x.cost),money(x.price),x.service?'—':x.stock,x.service?'Servicio':'Producto','<button data-edit="'+x.id+'">Editar</button>'])));if(!p.length)el.innerHTML+='<p class="muted">Sin coincidencias.</p>'}
function render(){let e=$('page');if(tab==='Usuarios'){renderUsers();return;}if(['Ventas','Productos','Inventario'].includes(tab)){e.innerHTML='<section class="panel">'+(tab==='Productos'?'<button id="new">+ Nuevo producto o servicio</button><br><br>':'')+toolbar()+'<div id="list"></div></section>'+(tab==='Ventas'?'<section class="panel"><h2>Venta actual</h2><div id="cart"></div></section>':'');controls();fillList();if($('new'))$('new').onclick=()=>productForm();if(tab==='Ventas')renderCart();return}if(tab==='Historial'){e.innerHTML='<section class="panel">'+table(['Folio','Fecha','Total','Pago','Empleado',''],[...state.sales].reverse().map(s=>row([esc(s.id.slice(0,8)),esc(new Date(s.date).toLocaleString('es-MX')),money(s.total),esc(s.method),esc(s.employee_name||'Anterior'),'<button data-ticket="'+s.id+'">Ticket</button>'])))+'</section>'}else if(tab==='Clientes'){e.innerHTML='<section class="panel"><form id="clientForm"><input name="name" placeholder="Nombre" required><input name="phone" placeholder="Teléfono"><button>Agregar cliente</button></form><br>'+table(['Nombre','Teléfono'],state.customers.map(c=>row([esc(c.name),esc(c.phone)])))+'</section>';$('clientForm').onsubmit=async ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target)),n=clone(state);n.customers.push({id:uid(),...d});if(await save(n))render()}}else if(tab==='Reportes'||tab==='Corte de caja'){let today=new Date().toLocaleDateString('en-CA'),sales=state.sales.filter(s=>tab==='Corte de caja'?((s.employee_id===session.user.id||(role==='admin'&&!s.employee_id))&&s.date>(state.cash.filter(x=>x.employee_id===session.user.id).at(-1)?.date||'1970-01-01T00:00:00.000Z')):new Date(s.date).toLocaleDateString('en-CA')===today),sum=a=>a.reduce((n,s)=>n+s.total,0),profit=sales.reduce((n,s)=>n+s.lines.reduce((k,l)=>k+(l.price-l.cost)*l.qty,0),0);e.innerHTML='<section class="panel"><h2>'+(tab==='Corte de caja'?'Turno actual':'Resumen de hoy')+'</h2><div class="grid">'+[['Ventas',money(sum(sales))],['Operaciones',sales.length],...(role==='admin'?[['Utilidad bruta',money(profit)]]:[]),['Efectivo',money(sum(sales.filter(s=>s.method==='Efectivo')))],['Tarjeta',money(sum(sales.filter(s=>s.method==='Tarjeta')))],['Transferencia',money(sum(sales.filter(s=>s.method==='Transferencia')))]] .map(([k,v])=>'<div><span class="muted">'+k+'</span><div class="metric">'+v+'</div></div>').join('')+'</div></section>'+(tab==='Corte de caja'?'<section class="panel"><p>Al confirmar el corte se guardará el cierre y terminará tu sesión.</p><button id="closeCash">Confirmar corte y cerrar sesión</button></section>':'');if(tab==='Corte de caja')$('closeCash').onclick=closeCash}else{e.innerHTML='<section class="panel"><p>Cuenta: '+esc(session.user.email)+'</p><button id="reload">Actualizar desde nube</button> <button id="backup">Exportar respaldo JSON</button></section>';$('reload').onclick=async()=>{try{await load();render()}catch(x){alert(x.message)}};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='papeleria-pos-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}}
function productForm(id){let p=state.products.find(x=>x.id===id)||{name:'',code:'',category:'',cost:0,price:0,stock:0,minimum:0,service:false};let categories=[...new Map(state.products.map(x=>String(x.category||'').trim()).filter(Boolean).map(c=>[norm(c),c])).values()].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));if(p.category&&!categories.some(c=>norm(c)===norm(p.category)))categories.push(p.category);let m=$('modal');m.innerHTML='<h2>'+(id?'Editar':'Nuevo')+' producto</h2><form id="productForm"><label>Nombre<input name="name" required value="'+esc(p.name)+'"></label><label>Código<input name="code" required value="'+esc(p.code)+'"></label><label>Categoría<select id="categorySelect" name="categorySelect"><option value="">Sin categoría</option>'+categories.map((c,i)=>'<option value="'+i+'" '+(norm(c)===norm(p.category)&&p.category?'selected':'')+'>'+esc(c)+'</option>').join('')+'<option value="new">+ Nueva categoría</option></select><input id="categoryNew" name="categoryNew" placeholder="Escribe la nueva categoría" maxlength="100" hidden disabled></label><label>Tipo<select name="service"><option value="0">Producto</option><option value="1" '+(p.service?'selected':'')+'>Servicio</option></select></label><label>Costo MXN<input name="cost" type="number" min="0" step=".01" required value="'+p.cost/100+'"></label><label>Precio MXN<input name="price" type="number" min="0" step=".01" required value="'+p.price/100+'"></label><label>Existencia<input name="stock" type="number" min="0" step="1" required value="'+p.stock+'"></label><label>Mínimo<input name="minimum" type="number" min="0" step="1" required value="'+p.minimum+'"></label><button type="button" id="cancel">Cancelar</button><button>Guardar</button></form>';m.showModal();$('cancel').onclick=()=>m.close();$('categorySelect').onchange=()=>{const isNew=$('categorySelect').value==='new',f=$('categoryNew');f.hidden=!isNew;f.disabled=!isNew;f.required=isNew;if(isNew)f.focus()};$('productForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.code=d.code.trim();d.name=d.name.trim();let category=d.categorySelect==='new'?String(d.categoryNew||'').trim():d.categorySelect===''?'':categories[Number(d.categorySelect)]||'';if(d.categorySelect==='new'&&!category)return alert('Escribe el nombre de la nueva categoría');category=categories.find(c=>norm(c)===norm(category))||category;if(!d.code||!d.name)return;if(state.products.some(x=>x.code===d.code&&x.id!==id))return alert('Código duplicado');let n=clone(state),v={id:id||uid(),name:d.name,code:d.code,category,cost:cents(d.cost),price:cents(d.price),stock:d.service==='1'?0:Number(d.stock),minimum:Number(d.minimum),service:d.service==='1'};if(id)n.products[n.products.findIndex(x=>x.id===id)]=v;else n.products.push(v);if(v.stock!==p.stock)n.movements.push({id:uid(),product:v.id,delta:v.stock-p.stock,date:new Date().toISOString(),reason:'Edición de producto'});if(await save(n)){m.close();render()}}}
function renderCart(){let e=$('cart');if(!e)return;let total=cart.reduce((n,l)=>n+l.qty*l.price,0);e.innerHTML=table(['Producto','Cantidad','Precio unitario','Subtotal',''],cart.map(l=>row([esc(l.name),'<input style="width:85px" type="number" min="1" step="1" data-qty="'+l.id+'" value="'+l.qty+'">','<input style="width:110px" type="number" min="0" step=".01" data-price="'+l.id+'" value="'+(l.price/100).toFixed(2)+'">',money(l.qty*l.price),'<button data-remove="'+l.id+'">Quitar</button>'])))+'<h2>Total: '+money(total)+'</h2><form id="checkout"><select name="customer"><option value="">Público general</option>'+state.customers.map(c=>'<option value="'+c.id+'" '+(customer===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><select name="method"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select><input name="paid" type="number" step=".01" min="0" placeholder="Importe recibido"><button '+(!cart.length?'disabled':'')+'>Cobrar</button></form>';$('checkout').customer.onchange=e=>customer=e.target.value;$('checkout').onsubmit=checkout}
async function checkout(e){e.preventDefault();if(!cart.length||busy)return;let f=Object.fromEntries(new FormData(e.target)),total=cart.reduce((k,l)=>k+l.qty*l.price,0),paid=f.method==='Efectivo'?(f.paid===''?total:cents(f.paid)):total;if(paid<total)return alert('Pago insuficiente');let v=await mutate('sale',{sale:{customer:f.customer,method:f.method,paid,lines:cart.map(({id,qty,price})=>({id,qty,price}))}});if(v){cart=[];customer='';render();printTicket(v.result)}}
function printTicket(s){let t=$('ticket');t.innerHTML='<h2>Papelería POS</h2><p>Empleado: '+esc(s.employee_name||'')+'</p><p>'+esc(new Date(s.date).toLocaleString('es-MX'))+'<br>Folio: '+esc(s.id.slice(0,8))+'</p>'+s.lines.map(l=>'<p>'+esc(l.name)+' × '+l.qty+' — '+money(l.qty*l.price)+'</p>').join('')+'<h3>Total '+money(s.total)+'</h3><p>Recibido '+money(s.paid)+' · Cambio '+money(s.change)+'</p>';t.hidden=false;window.print();t.hidden=true}
$('page').onclick=async e=>{let d=e.target.dataset;if(d.sort){descending=order===d.sort?!descending:false;order=d.sort;$('sort').value=order+':'+Number(descending);fillList()}if(d.edit)productForm(d.edit);if(d.add){let p=state.products.find(x=>x.id===d.add),l=cart.find(x=>x.id===p.id);if(!p.service&&(l?.qty||0)>=p.stock)return alert('Existencia insuficiente');if(l)l.qty++;else cart.push({id:p.id,name:p.name,qty:1,price:p.price,cost:p.cost??0});renderCart()}if(d.remove){cart=cart.filter(l=>l.id!==d.remove);renderCart()}if(d.adjust){let n=clone(state),p=n.products.find(x=>x.id===d.adjust),v=prompt('Cantidad a sumar o restar (existencia '+p.stock+')');if(v===null||v.trim()==='')return;let delta=Number(v);if(!Number.isInteger(delta)||p.stock+delta<0)return alert('Cantidad inválida');p.stock+=delta;n.movements.push({id:uid(),product:p.id,delta,date:new Date().toISOString(),reason:'Ajuste'});if(await save(n))fillList()}if(d.ticket){let s=state.sales.find(s=>s.id===d.ticket);if(s)printTicket(s)}};
$('page').onchange=e=>{let d=e.target.dataset;if(d.qty||d.price){let l=cart.find(x=>x.id===(d.qty||d.price)),v=Number(e.target.value);if(d.qty){let p=state.products.find(x=>x.id===l.id);if(Number.isInteger(v)&&v>0&&(p.service||v<=p.stock))l.qty=v;else alert('Cantidad inválida o sin existencia')}else if(e.target.value!==''&&Number.isFinite(v)&&v>=0)l.price=cents(v);renderCart()}};
async function renderUsers(){let e=$('page');e.innerHTML='<section class="panel"><h2>Usuarios y permisos</h2><form id="employeeForm"><input name="name" placeholder="Nombre del empleado" required><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" minlength="10" autocomplete="new-password" placeholder="Contraseña (mín. 10)" required><button>Crear empleado</button></form><p id="usersMsg"></p><div id="usersList"></div></section>';const display=rows=>{if(tab!=='Usuarios'||!$('usersList'))return;$('usersList').innerHTML=table(['Nombre','Rol','Estado',''],rows.map(u=>row([esc(u.name),u.role==='admin'?'Administrador':'Empleado',u.active?'Activo':'Desactivado',u.role==='employee'?'<button data-user="'+esc(u.user_id)+'" data-active="'+String(!u.active)+'">'+(u.active?'Desactivar':'Activar')+'</button>':''])));$('usersList').onclick=async ev=>{let d=ev.target.dataset;if(!d.user||!confirm('¿Cambiar acceso del empleado?'))return;try{display(await pos('toggle',{id:d.user,active:d.active==='true'}))}catch(x){alert(x.message)}}};$('employeeForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,b=f.querySelector('button');b.disabled=true;try{display(await pos('create',Object.fromEntries(new FormData(f))));f.reset();$('usersMsg').textContent='Empleado creado'}catch(x){$('usersMsg').textContent=x.message}finally{b.disabled=false}};try{display(await pos('users'))}catch(x){if($('usersMsg'))$('usersMsg').textContent=x.message}}
restoreSession();
</script></body></html>
