function renderSale(){const e=$('page');e.innerHTML='<section class="panel"><div class="sale-search"><input id="saleSearch" placeholder="Buscar producto o escanear código" autocomplete="off" aria-label="Buscar producto o código" aria-controls="saleMatches"><div id="saleMatches" class="sale-matches" hidden></div></div></section><section class="panel"><div id="cart"></div></section>';const input=$('saleSearch'),matches=$('saleMatches');function search(){query=input.value;const q=norm(query.trim());matches.replaceChildren();if(!q){matches.hidden=true;return}const rows=filtered().sort((a,b)=>Number(norm(b.code)===q)-Number(norm(a.code)===q)).slice(0,15);for(const p of rows){const btn=document.createElement('button');btn.type='button';btn.dataset.add=p.id;const label=document.createElement('span');label.textContent=p.name+' · '+p.code;const price=document.createElement('strong');price.textContent=money(p.price);btn.append(label,price);matches.append(btn)}if(!rows.length){const note=document.createElement('p');note.className='muted';note.style.padding='10px';note.textContent='Sin coincidencias';matches.append(note)}matches.hidden=false}input.oninput=search;input.onfocus=search;input.onkeydown=e=>{if(e.key==='Escape')matches.hidden=true;if(e.key==='ArrowDown'){e.preventDefault();matches.querySelector('button')?.focus()}if(e.key==='Enter'){e.preventDefault();let q=norm(input.value.trim());if(!q)return;let exact=state.products.find(p=>norm(p.code)===q);if(exact)addSaleProduct(exact.id);else if(matches.querySelectorAll('button').length===1)matches.querySelector('button').click()}};input.parentElement.addEventListener('focusout',e=>{if(!input.parentElement.contains(e.relatedTarget))matches.hidden=true});renderCart();input.focus()}
function addSaleProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const l=cart.find(x=>x.id===p.id);if(!p.service&&(l?.qty||0)>=p.stock)return alert('Existencia insuficiente');if(l)l.qty++;else cart.push({id:p.id,name:p.name,qty:1,price:p.price,cost:p.cost??0});selectedLine=p.id;query='';const input=$('saleSearch');if(input){input.value='';$('saleMatches').hidden=true;input.focus()}renderCart()}
function selectSaleLine(id){selectedLine=id;for(const tr of document.querySelectorAll('#cart tr[data-line]')){const active=tr.dataset.line===id;tr.classList.toggle('selected',active);tr.setAttribute('aria-selected',String(active))}if($('removeSelected'))$('removeSelected').disabled=!cart.some(l=>l.id===id)}
function renderCart(){let e=$('cart');if(!e)return;if(!cart.some(l=>l.id===selectedLine))selectedLine=null;let total=cart.reduce((n,l)=>n+l.qty*l.price,0);e.innerHTML='<div class="sale-cart">'+table(['Producto','Cantidad','Precio unitario','Subtotal'],cart.map(l=>'<tr tabindex="0" data-line="'+esc(l.id)+'" aria-selected="'+String(l.id===selectedLine)+'" class="'+(l.id===selectedLine?'selected':'')+'"><td>'+esc(l.name)+'</td><td><input aria-label="Cantidad" style="width:85px" type="number" min="1" step="1" data-qty="'+esc(l.id)+'" value="'+l.qty+'"></td><td><input aria-label="Precio unitario" style="width:110px" type="number" min="0" step=".01" data-price="'+esc(l.id)+'" value="'+(l.price/100).toFixed(2)+'"></td><td data-subtotal="'+esc(l.id)+'">'+money(l.qty*l.price)+'</td></tr>'))+(!cart.length?'<p class="muted">Agrega productos usando el buscador.</p>':'')+'</div><div class="sale-total"><span>Total</span><span id="saleTotal">'+money(total)+'</span></div><div class="sale-actions"><button class="pay" id="paySale" '+(!cart.length?'disabled':'')+'>Cobrar</button><button id="removeSelected" '+(!selectedLine?'disabled':'')+'>Quitar seleccionado</button><button class="cancel" id="cancelSale" '+(!cart.length?'disabled':'')+'>Cancelar venta</button></div>';for(const tr of e.querySelectorAll('tr[data-line]')){tr.addEventListener('click',()=>selectSaleLine(tr.dataset.line));tr.addEventListener('focusin',()=>selectSaleLine(tr.dataset.line))}$('paySale').onclick=openPayment;$('removeSelected').onclick=()=>{cart=cart.filter(l=>l.id!==selectedLine);selectedLine=null;renderCart();$('saleSearch')?.focus()};$('cancelSale').onclick=()=>{if(cart.length&&confirm('¿Cancelar la venta actual? No se modificará el inventario.')){cart=[];selectedLine=null;customer='';query='';renderSale()}}}
function openPayment(){if(!cart.length||busy)return;const m=$('modal'),subtotal=cart.reduce((n,l)=>n+l.qty*l.price,0);m.innerHTML='<h2 id="payHeading">Cobrar '+money(subtotal)+'</h2><form id="checkout"><label>Cliente<select name="customer"><option value="">Público general</option>'+state.customers.map(c=>'<option value="'+esc(c.id)+'" '+(customer===c.id?'selected':'')+'>'+esc(c.name)+' · '+esc(c.number||'')+'</option>').join('')+'</select></label><label>Escanear tarjeta<input id="cardScan" placeholder="CLT..." autocomplete="off"></label><label>Cupón<input name="coupon" placeholder="CUP..." autocomplete="off"></label><label>Forma de pago<select name="method"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></label><label>Importe recibido<input name="paid" type="number" step=".01" min="0"></label><p id="couponStatus"></p><button type="button" id="backPayment">Volver</button><button id="confirmPay">Confirmar cobro</button></form>';m.showModal();const f=$('checkout');function update(){const c=f.elements.customer.value,code=f.elements.coupon.value.trim().toUpperCase(),coupon=(state.coupons||[]).find(x=>x.code===code&&x.status==='disponible'&&x.customer_id===c&&subtotal>=x.value),net=subtotal-(coupon?.value||0);$('payHeading').textContent='Cobrar '+money(net);$('couponStatus').textContent=code?(coupon?'Descuento '+money(coupon.value):'Cupón no válido para esta compra'):'Sin cupón';$('confirmPay').disabled=!!code&&!coupon;f.elements.paid.placeholder=(net/100).toFixed(2)}f.elements.customer.onchange=()=>{customer=f.elements.customer.value;update()};f.elements.coupon.oninput=update;$('cardScan').oninput=()=>{let c=state.customers.find(x=>x.number===$('cardScan').value.trim().toUpperCase());if(c){f.elements.customer.value=c.id;customer=c.id;update()}};f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();if(e.target.id==='cardScan')f.elements.coupon.focus();else if(e.target.name==='coupon')f.elements.paid.focus()}});$('backPayment').onclick=()=>m.close();f.onsubmit=checkout;update()}
async function checkout(e){e.preventDefault();if(!cart.length||busy)return;let f=Object.fromEntries(new FormData(e.target)),subtotal=cart.reduce((k,l)=>k+l.qty*l.price,0),code=f.coupon.trim().toUpperCase(),coupon=(state.coupons||[]).find(x=>x.code===code&&x.status==='disponible'&&x.customer_id===f.customer&&subtotal>=x.value);if(code&&!coupon)return alert('Cupón inválido');let total=subtotal-(coupon?.value||0),paid=f.method==='Efectivo'?(f.paid===''?total:cents(f.paid)):total;if(paid<total)return alert('Pago insuficiente');let v=await mutate('sale',{sale:{customer:f.customer,coupon:code,method:f.method,paid,lines:cart.map(({id,qty,price})=>({id,qty,price}))}});if(v){$('modal').close();cart=[];selectedLine=null;customer='';query='';render();if(receiptSettings().auto!==false||v.result.issued?.length)printTicket(v.result)}}
function receiptSettings(){return {business:'Papelería POS',address:'',phone:'',thanks:'Gracias por su compra',width:'80',font:'monospace',size:'normal',header:'normal',auto:true,...state.receipt}}
function barcodeText(code){return '<p style="font-weight:bold;letter-spacing:1px;overflow-wrap:anywhere">'+esc(code)+'</p>'}
function paper(content,cfg){return '<div class="receipt-paper" style="width:'+ (cfg.width==='58'?'58':'80')+'mm;font-family:'+ (cfg.font==='Courier New'?'Courier New':'monospace')+';font-size:'+(cfg.size==='large'?'15':'11')+'px">'+content+'</div>'}
function ticketMarkup(s,cfg){return paper('<div style="text-align:center"><h2 style="font-size:'+(cfg.header==='large'?'22':'16')+'px">'+esc(cfg.business)+'</h2><p>'+esc(cfg.address)+'<br>'+esc(cfg.phone)+'</p></div><p>Empleado: '+esc(s.employee_name||'')+'<br>'+esc(new Date(s.date).toLocaleString('es-MX'))+'<br>Folio: '+esc(s.id.slice(0,8))+(s.customer_name?'<br>Cliente: '+esc(s.customer_name):'')+'</p><hr>'+s.lines.map(l=>'<div class="receipt-line"><span>'+esc(l.name)+' × '+l.qty+'</span><span>'+money(l.qty*l.price)+'</span></div>').join('')+'<hr><div class="receipt-line"><span>Subtotal</span><span>'+money(s.subtotal??s.total)+'</span></div>'+(s.discount?'<div class="receipt-line"><span>Cupón</span><span>-'+money(s.discount)+'</span></div>':'')+'<h3>Total '+money(s.total)+'</h3><p>Recibido '+money(s.paid)+'<br>Cambio '+money(s.change)+'</p><p style="text-align:center">'+esc(cfg.thanks)+'</p>',cfg)}
function couponMarkup(c,client,cfg){return paper('<div style="text-align:center"><h2>'+esc(cfg.business)+'</h2><h3>CUPÓN DE DESCUENTO</h3><h2>'+money(c.value)+'</h2><p>Cliente: '+esc(client?.name||'')+'</p>'+barcodeText(c.code)+'<p>Uso único. Compra mínima $50.00. No canjeable por efectivo.</p></div>',cfg)}
function printMarkup(markup){let t=$('ticket');t.innerHTML=markup;t.hidden=false;window.print();t.hidden=true}
function printTicket(s){const cfg=receiptSettings(),client=state.customers.find(c=>c.id===s.customer);printMarkup(ticketMarkup(s,cfg)+(s.issued||[]).map(code=>couponMarkup({code,value:5000},client,cfg)).join(''))}
function renderLoyalty(){const e=$('page');e.innerHTML='<section class="panel"><h2>Clientes y lealtad</h2><form id="clientForm"><input name="name" placeholder="Nombre" maxlength="100" required><input name="phone" placeholder="Teléfono" maxlength="35"><button>Agregar cliente</button></form><br>'+table(['Cliente','Tarjeta','Teléfono','Acumulado','Compras totales','Cupones',''],state.customers.map(c=>row([esc(c.name),esc(c.number||''),esc(c.phone),money(c.accrued||0),money(c.lifetime_spend||0),(state.coupons||[]).filter(x=>x.customer_id===c.id&&x.status==='disponible').length,'<button data-client="'+esc(c.id)+'">Ver / imprimir</button>'])))+'</section>';$('clientForm').onsubmit=async ev=>{ev.preventDefault();if(await mutate('customer',Object.fromEntries(new FormData(ev.target))))render()}}
function clientDetails(id){let c=state.customers.find(x=>x.id===id);if(!c)return;let m=$('modal');m.innerHTML='<h2>'+esc(c.name)+'</h2><p>Tarjeta: '+esc(c.number)+'</p><button id="printCard">Imprimir tarjeta</button><h3>Cupones</h3>'+table(['Código','Estado',''],(state.coupons||[]).filter(x=>x.customer_id===id).map(x=>row([esc(x.code),esc(x.status),x.status==='disponible'?'<button data-coupon="'+esc(x.code)+'">Imprimir</button>':''])))+'<button id="closeClient">Cerrar</button>';m.showModal();$('closeClient').onclick=()=>m.close();$('printCard').onclick=()=>printMarkup(paper('<h2>'+esc(receiptSettings().business)+'</h2><p>'+esc(c.name)+'</p>'+barcodeText(c.number),receiptSettings()));for(const b of m.querySelectorAll('[data-coupon]'))b.onclick=()=>printMarkup(couponMarkup(state.coupons.find(x=>x.code===b.dataset.coupon),c,receiptSettings()))}
function renderPrinter(){let cfg=receiptSettings(),e=$('page');e.innerHTML='<section class="panel"><h2>Configuración de tickets</h2><form id="receiptForm"><label>Negocio<input name="business" value="'+esc(cfg.business)+'" required></label><label>Dirección<input name="address" value="'+esc(cfg.address)+'"></label><label>Teléfono<input name="phone" value="'+esc(cfg.phone)+'"></label><label>Agradecimiento<input name="thanks" value="'+esc(cfg.thanks)+'"></label><label>Papel<select name="width"><option value="58">58 mm</option><option value="80">80 mm</option></select></label><label>Letra<select name="font"><option value="monospace">Monoespaciada</option><option value="Courier New">Courier New</option></select></label><label>Texto<select name="size"><option value="normal">Normal</option><option value="large">Grande</option></select></label><label>Encabezado<select name="header"><option value="normal">Normal</option><option value="large">Grande</option></select></label><label><input type="checkbox" name="auto">Abrir impresión al cobrar</label><button>Guardar configuración</button><button type="button" id="testPrint">Imprimir prueba</button></form><p class="muted">Selecciona la impresora térmica en el diálogo de impresión del navegador.</p></section><section class="panel"><h2>Vista previa en vivo</h2><p class="muted">Ticket de ejemplo, no registra una venta.</p><div id="receiptPreview"></div></section>';let f=$('receiptForm');for(let k of ['width','font','size','header'])f.elements[k].value=cfg[k];f.elements.auto.checked=cfg.auto;const read=()=>({...Object.fromEntries(new FormData(f)),auto:f.elements.auto.checked}),demo={id:'PRUEBA001',date:new Date().toISOString(),employee_name:operatorName,lines:[{name:'Impresión color',qty:2,price:1000},{name:'Cuaderno',qty:1,price:3500}],subtotal:5500,total:5500,paid:6000,change:500};function preview(){$('receiptPreview').innerHTML=ticketMarkup(demo,read())}f.oninput=preview;f.onchange=preview;f.onsubmit=async ev=>{ev.preventDefault();if(await mutate('receipt',{settings:read()}))alert('Configuración guardada')};$('testPrint').onclick=()=>printMarkup(ticketMarkup(demo,read()));preview()}

$('page').onclick=async e=>{let d=e.target.dataset;if(d.client)clientDetails(d.client);if(d.sort){descending=order===d.sort?!descending:false;order=d.sort;$('sort').value=order+':'+Number(descending);fillList()}if(d.edit)productForm(d.edit);if(d.add)addSaleProduct(d.add);if(d.adjust){let n=clone(state),p=n.products.find(x=>x.id===d.adjust),v=prompt('Cantidad a sumar o restar (existencia '+p.stock+')');if(v===null||v.trim()==='')return;let delta=Number(v);if(!Number.isInteger(delta)||p.stock+delta<0)return alert('Cantidad inválida');p.stock+=delta;n.movements.push({id:uid(),product:p.id,delta,date:new Date().toISOString(),reason:'Ajuste'});if(await save(n))fillList()}if(d.ticket){let s=state.sales.find(s=>s.id===d.ticket);if(s)printTicket(s)}};
$('page').onchange=e=>{let d=e.target.dataset;if(d.qty||d.price){let l=cart.find(x=>x.id===(d.qty||d.price)),v=Number(e.target.value);if(d.qty){let p=state.products.find(x=>x.id===l.id);if(Number.isInteger(v)&&v>0&&(p.service||v<=p.stock))l.qty=v;else alert('Cantidad inválida o sin existencia')}else if(e.target.value!==''&&Number.isFinite(v)&&v>=0)l.price=cents(v);e.target.value=d.qty?l.qty:(l.price/100).toFixed(2);const td=$('cart')?.querySelector('[data-subtotal="'+CSS.escape(l.id)+'"]');if(td)td.textContent=money(l.qty*l.price);if($('saleTotal'))$('saleTotal').textContent=money(cart.reduce((n,x)=>n+x.qty*x.price,0))}};
async function renderUsers(){let e=$('page');e.innerHTML='<section class="panel"><h2>Usuarios y permisos</h2><form id="employeeForm"><input name="name" placeholder="Nombre del empleado" required><input name="email" type="email" placeholder="Correo" required><input name="password" type="password" minlength="10" autocomplete="new-password" placeholder="Contraseña (mín. 10)" required><button>Crear empleado</button></form><p id="usersMsg"></p><div id="usersList"></div></section>';const display=rows=>{if(tab!=='Usuarios'||!$('usersList'))return;$('usersList').innerHTML=table(['Nombre','Rol','Estado',''],rows.map(u=>row([esc(u.name),u.role==='admin'?'Administrador':'Empleado',u.active?'Activo':'Desactivado',u.role==='employee'?'<button data-user="'+esc(u.user_id)+'" data-active="'+String(!u.active)+'">'+(u.active?'Desactivar':'Activar')+'</button>':''])));$('usersList').onclick=async ev=>{let d=ev.target.dataset;if(!d.user||!confirm('¿Cambiar acceso del empleado?'))return;try{display(await pos('toggle',{id:d.user,active:d.active==='true'}))}catch(x){alert(x.message)}}};$('employeeForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,b=f.querySelector('button');b.disabled=true;try{display(await pos('create',Object.fromEntries(new FormData(f))));f.reset();$('usersMsg').textContent='Empleado creado'}catch(x){$('usersMsg').textContent=x.message}finally{b.disabled=false}};try{display(await pos('users'))}catch(x){if($('usersMsg'))$('usersMsg').textContent=x.message}}
